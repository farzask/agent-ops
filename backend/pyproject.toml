[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres and Redis; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    # Long strings in prompt templates are more readable unwrapped.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated-file conventions.
"alembic/versions/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# The codebase is annotated, but not strict-clean; CI checks for real errors
# rather than enforcing full strictness on day one.
check_untyped_defs = true
